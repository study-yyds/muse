# Muse 单机部署：server（NestJS + 迁移）+ web（Nginx 静态 + 反代）
# 启动：docker compose -f deploy/docker-compose.yml up -d --build
# 配置：deploy/.env（见 deploy/.env.example）

services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    env_file: .env
    volumes:
      # 上传文件持久化（封面/角色图/promo 视频/素材包）
      - uploads:/app/server/public/uploads
      # 运行日志
      - logs:/app/server/logs
    healthcheck:
      # node:20-slim 自带 fetch；任一 HTTP 响应（含 401）即认为存活
      test: ["CMD", "node", "-e", "fetch('http://localhost:3004/api/books?status=active').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      # 80 被宿主机既有 nginx 容器占用，改用 8081
      - "8081:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  uploads:
  logs:
